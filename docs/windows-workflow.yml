name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build in clean Windows environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          .\build.ps1
      - name: Verify portable EXE with isolated profile
        run: .\.venv\Scripts\python.exe tools/verify_release.py --ui-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: HaloTruckDash-win-x64
          path: |
            dist/*win-x64.zip
            dist/v*/SHA256SUMS.txt
          if-no-files-found: error
